name: 시세 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 (GitHub 사정에 따라 지연될 수 있음)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 주식 시세·환율 받아오기
        run: python scripts/fetch_prices.py
      - name: 배포 파일 준비
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/asset.json data/prices.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
