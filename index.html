<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PLAN:D 자산현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --debt:#9b9a94;
  --up:#d03b3b; --down:#2a78d6;           /* 한국식: 상승 빨강, 하락 파랑 */
  --good:#006300;
  --accent:#2a78d6;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --debt:#5d5c57; --up:#e66767; --down:#3987e5; --good:#0ca30c; --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --debt:#5d5c57; --up:#e66767; --down:#3987e5; --good:#0ca30c; --accent:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.brand{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
h1{font-size:24px;margin:2px 0 0;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.live{background:#0ca30c;box-shadow:0 0 0 3px color-mix(in srgb,#0ca30c 25%,transparent)}
.dot.stale{background:#fab219}
.iconbtn{cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.grid{display:grid;gap:14px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
.label{font-size:13px;color:var(--ink-2);font-weight:500}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}

/* stacked bar */
.stack{display:flex;gap:2px;height:14px;margin:16px 0 14px}
.stack > div{height:100%;min-width:2px;transition:filter .15s}
.stack > div:first-child{border-radius:4px 0 0 4px}
.stack > div:last-child{border-radius:0 4px 4px 0}
.stack > div:only-child{border-radius:4px}
.stack > div:hover{filter:brightness(1.12)}
.legend{display:grid;gap:8px}
.legend .row{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-size:14px}
.sw{width:10px;height:10px;border-radius:3px}
.legend .pct{color:var(--muted);font-size:13px;min-width:48px;text-align:right}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px;width:max-content;max-width:100%;margin:28px 0 14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 18px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab .t{font-weight:500;color:var(--muted);margin-left:6px;font-size:13px}
.panel[hidden]{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
h2{font-size:16px;margin:0 0 4px;font-weight:700}
.h2sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}

/* table */
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--axis)}
.tk{font-weight:600}
.acct{display:block;font-size:12px;color:var(--muted);font-weight:400}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.buy{color:var(--up)} .pill.sell{color:var(--down)}
.src{font-size:11px;color:var(--muted)}
.na{color:var(--muted)}

/* bar rows (target vs current) */
.bars{display:grid;gap:12px}
.br{display:grid;grid-template-columns:96px 1fr 112px;gap:12px;align-items:center;font-size:13.5px}
.br .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:22px}
.track .gridl{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 25%);opacity:.7}
.fill{position:absolute;left:0;top:5px;height:12px;border-radius:0 4px 4px 0;background:var(--s1)}
.target{position:absolute;top:0;width:2px;height:22px;background:var(--ink);border-radius:1px}
.target::after{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:3px;background:var(--ink);border-radius:1px}
.br .dv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.keys{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-top:14px;flex-wrap:wrap}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{display:inline-block}

/* list rows */
.lrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--grid);font-size:14px}
.lrow:last-child{border-bottom:0}
.lrow .r{font-weight:600;font-variant-numeric:tabular-nums}
.lrow.total{border-top:1px solid var(--axis);border-bottom:0;font-weight:700;margin-top:2px}
.sect{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:18px 0 2px}
.sect:first-child{margin-top:0}

.note{font-size:12.5px;color:var(--muted);margin-top:24px;line-height:1.7}
.tip{position:fixed;pointer-events:none;z-index:10;background:var(--ink);color:var(--surface);font-size:12.5px;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;transform:translate(-50%,calc(-100% - 10px))}
.tip.on{opacity:1}
.empty{color:var(--muted);text-align:center;padding:60px 0}

@media (max-width:820px){
  .hero,.two{grid-template-columns:1fr}
  .big{font-size:34px}
}
@media (max-width:520px){
  .wrap{padding:20px 16px 48px}
  .card{padding:16px}
  .tbl-wrap{margin:0 -16px;padding:0 16px}
  .br{grid-template-columns:76px 1fr 92px;gap:8px}
  .tab{padding:8px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .tab .t{margin-left:0;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">PLAN:D</div>
      <h1>자산현황</h1>
    </div>
    <div class="meta">
      <span class="chip" title="엑셀 기준일"><span class="label" style="font-size:13px">기준일</span><b id="baseDate">-</b></span>
      <span class="chip" title="시세 갱신 시각"><span class="dot" id="liveDot"></span><span id="priceTime">시세 불러오는 중</span></span>
      <span class="chip" title="달러/원 환율">USD/KRW <b id="fxChip">-</b></span>
      <button class="chip iconbtn" id="maskBtn" aria-pressed="false" title="금액 가리기">금액 가리기</button>
    </div>
  </header>

  <main id="app"><div class="empty">불러오는 중…</div></main>

  <p class="note">
    · 주식은 GitHub에서 약 15분 간격으로 받아온 시세(Yahoo Finance)로 계산하며, 국내 종목은 15~20분 지연될 수 있습니다.<br>
    · 시세를 받아오지 못한 종목은 매입금액(수량 × 평단가)으로 대신 표시합니다.<br>
    · 부동산·자동차·현금·부채는 엑셀 기준일 값이며 매월 갱신됩니다. 투자 권유가 아닌 개인 기록용 페이지입니다.
  </p>
</div>
<div class="tip" id="tip"></div>

<script>
(() => {
'use strict';
const PRICE_REFRESH_MS = 5 * 60 * 1000;
const TAB_COLOR = { '주식': 'var(--s1)', '부동산': 'var(--s2)', '기타': 'var(--s3)' };
const ACCT_COLOR = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];

let asset = null, prices = null, masked = false, activeTab = '주식';
try { masked = localStorage.getItem('pland-mask') === '1'; activeTab = localStorage.getItem('pland-tab') || '주식'; } catch (e) {}

/* ---------- format ---------- */
const nf = new Intl.NumberFormat('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => masked ? '••••••' : nf.format(Math.round(n)) + '원';
function short(n) {
  if (masked) return '••••';
  const a = Math.abs(n), sg = n < 0 ? '-' : '';
  if (a >= 1e8) {
    const eok = Math.floor(a / 1e8), man = Math.round((a % 1e8) / 1e4);
    return sg + eok + '억' + (man ? ' ' + nf.format(man) + '만' : '');
  }
  if (a >= 1e4) return sg + nf.format(Math.round(a / 1e4)) + '만';
  return sg + nf.format(Math.round(a));
}
const signed = (n, f = short) => (n > 0 ? '+' : '') + f(n);
const pct = (x, d = 1) => (x == null || !isFinite(x)) ? '-' : (x * 100).toFixed(d) + '%';
const spct = (x, d = 2) => (x == null || !isFinite(x)) ? '-' : (x > 0 ? '+' : '') + (x * 100).toFixed(d) + '%';
const cls = x => x > 0 ? 'up' : x < 0 ? 'down' : '';
const price = (p, cur) => masked && false ? '' : (cur === 'USD' ? '$' + p.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : nf.format(Math.round(p)) + '원');
const qtyFmt = q => masked ? '•••' : (+q).toLocaleString('ko-KR', {maximumFractionDigits: 4});

/* ---------- data ---------- */
async function getJSON(path) {
  const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}
function inline(id) { const el = document.getElementById(id); return el ? JSON.parse(el.textContent) : null; }

const fxNow = () => prices?.fx?.USDKRW?.price ?? null;
const fxPrev = () => prices?.fx?.USDKRW?.prevClose ?? fxNow();

function evalHolding(h) {
  const q = prices?.quotes?.[h.ticker];
  const usd = h.currency === 'USD';
  const fx = usd ? fxNow() : 1, fxp = usd ? fxPrev() : 1;
  const qty = +h.qty, avg = +h.avgPrice;
  const fxCost = usd ? (fxNow() || asset.fxManual || 0) : 1;
  const fallback = qty > 0 && avg > 0 ? qty * avg * fxCost : (+h.value || 0);   // 시세 없을 때: 매입금액
  const out = { ...h, quote: q || null, live: false, cur: fallback, day: null, dayPct: null, pnl: null, pnlPct: null };
  if (q && q.prevClose) out.dayPct = q.price / q.prevClose - 1;
  if (q && qty > 0 && fx) {
    out.live = true;
    out.cur = qty * q.price * fx;
    if (q.prevClose && fxp) out.day = out.cur - qty * q.prevClose * fxp;
    if (+h.avgPrice > 0) {
      out.pnlPct = q.price / h.avgPrice - 1;
      out.pnl = qty * (q.price - h.avgPrice) * fx;
    }
  }
  return out;
}

function model() {
  const H = asset.holdings.map(evalHolding);
  const stockTotal = H.reduce((s, h) => s + h.cur, 0);
  H.forEach(h => h.w = stockTotal ? h.cur / stockTotal : 0);
  const byAcct = {};
  H.forEach(h => (byAcct[h.account] ??= { name: h.account, value: 0, n: 0 }, byAcct[h.account].value += h.cur, byAcct[h.account].n++));
  const deposit = asset.assets.filter(a => a.group === '예수금').reduce((s, a) => s + a.value, 0);

  const realEstate = asset.assets.filter(a => a.group === '부동산');
  const others = asset.assets.filter(a => a.group !== '부동산' && a.group !== '예수금');
  const debts = asset.debts;
  const sum = arr => arr.reduce((s, a) => s + a.value, 0);

  const tabs = {
    '주식':   { asset: stockTotal + deposit, debt: sum(debts.filter(d => d.tab === '주식')) },
    '부동산': { asset: sum(realEstate),       debt: sum(debts.filter(d => d.tab === '부동산')) },
    '기타':   { asset: sum(others),           debt: sum(debts.filter(d => d.tab === '기타')) },
  };
  const totalAsset = Object.values(tabs).reduce((s, t) => s + t.asset, 0);
  const totalDebt = sum(debts);
  const liveH = H.filter(h => h.live);
  const day = liveH.length ? liveH.reduce((s, h) => s + (h.day || 0), 0) : null;
  const pnlH = H.filter(h => h.pnl != null);
  const pnl = pnlH.length ? pnlH.reduce((s, h) => s + h.pnl, 0) : null;
  const usdTotal = H.filter(h => h.currency === 'USD').reduce((s, h) => s + h.cur, 0);
  return { H, stockTotal, byAcct: Object.values(byAcct), deposit, realEstate, others, debts, tabs, totalAsset, totalDebt, day, pnl, pnlH, liveH, usdTotal };
}

/* ---------- render ---------- */
function stackBar(items) {
  const tot = items.reduce((s, i) => s + Math.max(0, i.value), 0) || 1;
  return '<div class="stack">' + items.filter(i => i.value > 0).map(i =>
    `<div style="flex:${i.value / tot};background:${i.color}" data-tip="${esc(i.name)} · ${esc(short(i.value))} (${pct(i.value / tot)})"></div>`).join('') + '</div>';
}
function legend(items, total) {
  return '<div class="legend">' + items.map(i =>
    `<div class="row"><span class="sw" style="background:${i.color}"></span><span>${esc(i.name)}</span><span class="num" style="font-weight:600">${short(i.value)}</span><span class="pct num">${pct(i.value / total)}</span></div>`).join('') + '</div>';
}

function renderSummary(M) {
  const net = M.totalAsset - M.totalDebt;
  const comp = Object.entries(M.tabs).map(([k, t]) => ({ name: k, value: t.asset, color: TAB_COLOR[k] }));
  const dayHtml = M.day == null ? '<span class="na" style="font-size:15px;font-weight:500">시세 반영 후 표시</span>'
    : `<span class="${cls(M.day)}">${signed(M.day)}</span>`;
  return `
  <section class="hero">
    <div class="card">
      <div class="label">순자산</div>
      <div class="big num">${short(net)}<span style="font-size:.5em;font-weight:600;margin-left:4px">원</span></div>
      <div class="sub num">${won(net)}</div>
      <div class="kpis" style="margin-top:22px">
        <div class="kpi"><div class="label">총자산</div><div class="v num">${short(M.totalAsset)}</div></div>
        <div class="kpi"><div class="label">총부채</div><div class="v num">${short(M.totalDebt)}</div><div class="s">부채비율 ${pct(M.totalDebt / M.totalAsset)}</div></div>
        <div class="kpi"><div class="label">오늘 주식 변동</div><div class="v num">${dayHtml}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="label">자산 구성</div>
      ${stackBar(comp)}
      ${legend(comp, M.totalAsset)}
    </div>
  </section>`;
}

function posPill(p) {
  const c = p === '매수' ? 'buy' : p === '매도' ? 'sell' : '';
  return p ? `<span class="pill ${c}">${esc(p)}</span>` : '';
}

function renderStock(M) {
  const H = [...M.H].sort((a, b) => b.cur - a.cur);
  const rows = H.map(h => {
    const q = h.quote;
    const pr = q ? `${price(q.price, h.currency)}<span class="acct ${cls(h.dayPct)}">${spct(h.dayPct)}</span>` : '<span class="na">-</span>';
    return `<tr>
      <td><span class="tk">${esc(h.name)}</span><span class="acct">${esc(h.account)}</span></td>
      <td>${h.qty ? qtyFmt(h.qty) : '<span class="na">-</span>'}</td>
      <td>${h.avgPrice ? price(h.avgPrice, h.currency) : '<span class="na">-</span>'}</td>
      <td>${pr}</td>
      <td><b>${won(h.cur)}</b><span class="acct">${h.live ? '실시간' : (+h.qty > 0 ? '시세 없음 · 매입가' : '엑셀 기준')}</span></td>
      <td>${h.pnlPct == null ? '<span class="na">-</span>' : `<span class="${cls(h.pnlPct)}">${spct(h.pnlPct)}</span><span class="acct ${cls(h.pnl)}">${signed(h.pnl)}</span>`}</td>
      <td>${pct(h.w)}</td>
      <td>${posPill(h.position)}</td>
    </tr>`;
  }).join('');

  // target vs current
  const tv = (asset.targets || []).map(t => ({ name: t.group, target: t.target,
    cur: M.H.filter(h => h.targetGroup === t.group).reduce((s, h) => s + h.w, 0) }));
  const maxW = Math.max(0.4, ...tv.map(t => Math.max(t.cur, t.target))) ;
  const scale = Math.ceil(maxW * 10) / 10, ticks = Math.round(scale * 10);
  const bars = tv.map(t => {
    const d = t.cur - t.target;
    const dir = Math.abs(d) < 0.005 ? '적정' : d > 0 ? '축소' : '확대';
    return `<div class="br" data-tip="${esc(t.name)} · 현재 ${pct(t.cur)} / 목표 ${pct(t.target)}">
      <span class="nm">${esc(t.name)}</span>
      <div class="track"><div class="gridl" style="background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px calc(100% / ${ticks}))"></div>
        <div class="fill" style="width:${t.cur / scale * 100}%"></div>
        <div class="target" style="left:calc(${t.target / scale * 100}% - 1px)"></div></div>
      <span class="dv">${spct(d, 1)} <span style="color:var(--muted)">${dir}</span></span></div>`;
  }).join('');

  const accts = M.byAcct.map((a, i) => ({ name: a.name, value: a.value, color: ACCT_COLOR[i % ACCT_COLOR.length], n: a.n }));
  const fx = fxNow();
  const pnlKpi = M.pnl == null ? '<span class="na" style="font-size:15px;font-weight:500">시세 반영 후 표시</span>' : `<span class="${cls(M.pnl)}">${signed(M.pnl)}</span>`;

  return `
  <div class="kpis" style="margin-bottom:14px">
    <div class="card kpi"><div class="label">주식 평가액</div><div class="v num">${short(M.stockTotal)}</div><div class="s">예수금 ${short(M.deposit)} 별도</div></div>
    <div class="card kpi"><div class="label">달러 / 원화 자산</div><div class="v num">${pct(M.usdTotal / M.stockTotal, 0)} <span style="color:var(--muted);font-weight:500">/ ${pct(1 - M.usdTotal / M.stockTotal, 0)}</span></div><div class="s">${short(M.usdTotal)} / ${short(M.stockTotal - M.usdTotal)}</div></div>
    <div class="card kpi"><div class="label">평가손익</div><div class="v num">${pnlKpi}</div><div class="s">${M.pnlH.length ? M.pnlH.length + '개 종목 기준' : ''}</div></div>
    <div class="card kpi"><div class="label">USD/KRW</div><div class="v num">${fx ? nf.format(fx.toFixed(2)) : '-'}</div><div class="s ${cls(fx - fxPrev())}">${fx && fxPrev() ? spct(fx / fxPrev() - 1) + ' 전일대비' : ''}</div></div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <h2>보유 종목</h2>
    <p class="h2sub">현재가는 전일 종가 대비 등락률을 함께 표시합니다</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>종목</th><th>보유수량</th><th>평단가</th><th>현재가</th><th>평가금액</th><th>수익률</th><th>비중</th><th>포지션</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>합계</td><td></td><td></td><td></td><td>${won(M.stockTotal)}</td><td>${M.pnl == null ? '' : `<span class="${cls(M.pnl)}">${signed(M.pnl)}</span>`}</td><td>100%</td><td></td></tr></tfoot>
    </table></div>
  </div>

  <div class="two">
    <div class="card">
      <h2>목표비중 vs 현재비중</h2>
      <p class="h2sub">막대는 현재 비중, 세로선은 목표 비중 · 오른쪽은 차이</p>
      <div class="bars">${bars}</div>
      <div class="keys"><span><i style="width:14px;height:8px;background:var(--s1);border-radius:2px"></i>현재</span><span><i style="width:2px;height:12px;background:var(--ink)"></i>목표</span><span style="color:var(--muted)">눈금 10%</span></div>
    </div>
    <div class="card">
      <h2>계좌별 배분</h2>
      <p class="h2sub">계좌별 평가금액과 비중</p>
      ${stackBar(accts)}
      <div class="legend">${accts.map(a => `<div class="row"><span class="sw" style="background:${a.color}"></span><span>${esc(a.name)} <span style="color:var(--muted);font-size:12.5px">${a.n}종목</span></span><span class="num" style="font-weight:600">${short(a.value)}</span><span class="pct num">${pct(a.value / M.stockTotal)}</span></div>`).join('')}</div>
    </div>
  </div>`;
}

function renderRealEstate(M) {
  const val = M.tabs['부동산'].asset;
  const ds = M.debts.filter(d => d.tab === '부동산');
  const debt = ds.reduce((s, d) => s + d.value, 0);
  const equity = val - debt;
  const segs = [...ds.map((d, i) => ({ name: d.name, value: d.value, color: i ? 'color-mix(in srgb,var(--debt) 65%,var(--surface))' : 'var(--debt)' })),
                { name: '순지분', value: Math.max(0, equity), color: 'var(--s2)' }];
  return `
  <div class="kpis" style="margin-bottom:14px">
    <div class="card kpi"><div class="label">부동산 가치</div><div class="v num">${short(val)}</div><div class="s">엑셀 기준일 값</div></div>
    <div class="card kpi"><div class="label">담보대출 합계</div><div class="v num">${short(debt)}</div><div class="s">${ds.length}건</div></div>
    <div class="card kpi"><div class="label">순지분</div><div class="v num">${short(equity)}</div><div class="s">가치 − 대출</div></div>
    <div class="card kpi"><div class="label">LTV</div><div class="v num">${pct(debt / val)}</div><div class="s">대출 ÷ 가치</div></div>
  </div>
  <div class="two">
    <div class="card">
      <h2>가치 구성</h2>
      <p class="h2sub">부동산 가치를 대출과 순지분으로 나눈 비율</p>
      ${stackBar(segs)}
      ${legend(segs, val)}
    </div>
    <div class="card">
      <h2>상세</h2>
      <p class="h2sub">자산과 연결된 부채</p>
      <div class="sect">자산</div>
      ${M.realEstate.map(a => `<div class="lrow"><span>${esc(a.name)}</span><span class="r">${won(a.value)}</span></div>`).join('')}
      <div class="sect">부채</div>
      ${ds.map(d => `<div class="lrow"><span>${esc(d.name)}</span><span class="r">−${won(d.value)}</span></div>`).join('')}
      <div class="lrow total"><span>순지분</span><span class="r">${won(equity)}</span></div>
    </div>
  </div>`;
}

function renderOther(M) {
  const cars = M.others.filter(a => a.group === '자동차');
  const cash = M.others.filter(a => a.group === '현금성');
  const ds = M.debts.filter(d => d.tab === '기타');
  const A = M.tabs['기타'].asset, D = M.tabs['기타'].debt;
  const sumv = arr => arr.reduce((s, a) => s + a.value, 0);
  const comp = [{ name: '자동차', value: sumv(cars), color: 'var(--s3)' }, { name: '현금성', value: sumv(cash), color: 'var(--s4)' }];
  const list = arr => arr.map(a => `<div class="lrow"><span>${esc(a.name)}</span><span class="r">${won(a.value)}</span></div>`).join('');
  return `
  <div class="kpis" style="margin-bottom:14px">
    <div class="card kpi"><div class="label">기타 자산</div><div class="v num">${short(A)}</div><div class="s">자동차 · 현금성</div></div>
    <div class="card kpi"><div class="label">기타 부채</div><div class="v num">${short(D)}</div><div class="s">마이너스통장 · 카드할부</div></div>
    <div class="card kpi"><div class="label">순액</div><div class="v num ${D > A ? 'down' : ''}">${short(A - D)}</div><div class="s">자산 − 부채</div></div>
  </div>
  <div class="two">
    <div class="card">
      <h2>자산</h2>
      <p class="h2sub">자동차는 엑셀에 입력한 평가액 기준</p>
      ${stackBar(comp)}
      <div class="sect">자동차</div>${list(cars)}
      <div class="sect">현금성</div>${list(cash)}
      <div class="lrow total"><span>합계</span><span class="r">${won(A)}</span></div>
    </div>
    <div class="card">
      <h2>부채</h2>
      <p class="h2sub">부동산 담보대출 외 부채</p>
      ${stackBar(ds.map((d, i) => ({ name: d.name, value: d.value, color: i ? 'color-mix(in srgb,var(--debt) 65%,var(--surface))' : 'var(--debt)' })))}
      ${list(ds)}
      <div class="lrow total"><span>합계</span><span class="r">${won(D)}</span></div>
    </div>
  </div>`;
}

function render() {
  if (!asset) return;
  const M = model();
  document.getElementById('baseDate').textContent = asset.baseDate.replace(/-/g, '.');
  const fx = fxNow();
  document.getElementById('fxChip').textContent = fx ? nf.format(fx.toFixed(2)) : '-';
  const dot = document.getElementById('liveDot'), pt = document.getElementById('priceTime');
  if (prices?.updatedAt) {
    const t = new Date(prices.updatedAt), age = (Date.now() - t) / 60000;
    dot.className = 'dot ' + (age < 90 ? 'live' : 'stale');
    pt.textContent = '시세 ' + t.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  } else { dot.className = 'dot'; pt.textContent = '시세 없음 · 엑셀 기준'; }
  const mb = document.getElementById('maskBtn');
  mb.textContent = masked ? '금액 보기' : '금액 가리기'; mb.setAttribute('aria-pressed', masked);

  const tabBtns = ['주식', '부동산', '기타'].map(k => {
    const t = M.tabs[k];
    return `<button class="tab" role="tab" aria-selected="${k === activeTab}" data-tab="${k}">${k}<span class="t num">${short(t.asset - t.debt)}</span></button>`;
  }).join('');
  const body = activeTab === '부동산' ? renderRealEstate(M) : activeTab === '기타' ? renderOther(M) : renderStock(M);
  document.getElementById('app').innerHTML = renderSummary(M) +
    `<nav class="tabs" role="tablist">${tabBtns}</nav><section class="panel" role="tabpanel">${body}</section>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { activeTab = t.dataset.tab; try { localStorage.setItem('pland-tab', activeTab); } catch (_) {} render(); }
  if (e.target.closest('#maskBtn')) { masked = !masked; try { localStorage.setItem('pland-mask', masked ? '1' : '0'); } catch (_) {} render(); }
});
const tip = document.getElementById('tip');
document.addEventListener('pointermove', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.classList.remove('on'); return; }
  tip.textContent = el.dataset.tip; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.classList.add('on');
});
document.addEventListener('pointerleave', () => tip.classList.remove('on'));

async function loadPrices() {
  try { prices = inline('prices-inline') || await getJSON('data/prices.json'); } catch (e) { console.warn('시세 없음', e); }
  render();
}
(async () => {
  try { asset = inline('asset-inline') || await getJSON('data/asset.json'); }
  catch (e) { document.getElementById('app').innerHTML = '<div class="empty">자산 데이터를 불러오지 못했습니다.</div>'; return; }
  render();
  await loadPrices();
  setInterval(loadPrices, PRICE_REFRESH_MS);
})();
})();
</script>
</body>
</html>
